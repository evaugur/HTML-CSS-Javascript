<!-- inside index.html -->
<html>
  <head>
    <title>Typing game</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <div id="page">
      <div class="app-shell">
        <h1>Typing game!</h1>
        <div id="instructions">
          <p>
            Practice your typing skills with quotes from twenty one pilots.
            Click "Start" to begin!
          </p>
        </div>
        <div id="main-container">
          <p id="quote" aria-live="polite"></p>
          <p id="message" aria-live="assertive"></p>
          <!-- This will display any status messages -->
          <div class="controls">
            <input type="text" aria-label="current word" id="typed-value" />
            <!-- The textbox for typing -->
            <button class="button" id="start-button" role="button">
              Start
            </button>
            <!-- To start the game -->
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
